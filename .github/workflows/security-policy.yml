name: Security supply-chain policy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-policy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (read-only token)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Guard pinned Actions and explicit permissions
        run: python3 scripts/check_workflow_security.py
