name: LabMate E11 pixel legacy host coverage inventory (NO DEVICE)
on:
  push:
    branches:
      - dev/v2.0-e11-ui-completion-20261028
    paths:
      - "scripts/audit-v20-e11-legacy-coverage.sh"
      - ".github/workflows/v20-e11-legacy-coverage-review.yml"
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Run unmodified legacy UI and host suites (diagnostic only)
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/audit-v20-e11-legacy-coverage.sh
