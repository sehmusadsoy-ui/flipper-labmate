name: v1.8 E11.1a experimental firmware lease ABI (NO FLASH)

on:
  push:
    branches: [dev/v1.8-completion]
    paths:
      - "scripts/patch_momentum_resource_lease.py"
      - "scripts/patch_momentum_i2c_timeout.py"
      - ".github/workflows/check-v18-firmware-lease-abi.yml"
      - "src/**"
      - "application.fam"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile_experimental_pair:
    name: Build exact Momentum with dormant lease API and integrated LabMate (NO DEVICE)
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout LabMate DEV source
        uses: actions/checkout@v4
        with:
          path: labmate
          persist-credentials: false

      - name: Checkout exact pinned Momentum firmware source
        uses: actions/checkout@v4
        with:
          repository: Next-Flip/Momentum-Firmware
          ref: d3f89dfe2ef6b01839201598e9be1590cba80322
          path: momentum-src
          persist-credentials: false

      - name: Check fail-closed source preconditions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile labmate/scripts/patch_momentum_resource_lease.py
          test "$(git -C momentum-src rev-parse HEAD)" = \
            "d3f89dfe2ef6b01839201598e9be1590cba80322"
          python3 labmate/scripts/patch_momentum_resource_lease.py momentum-src
          python3 labmate/scripts/patch_momentum_i2c_timeout.py momentum-src

      - name: Apply both API patches to ephemeral CI source ONLY
        shell: bash
        run: |
          set -euo pipefail
          python3 labmate/scripts/patch_momentum_i2c_timeout.py momentum-src --apply
          python3 labmate/scripts/patch_momentum_resource_lease.py \
            momentum-src --allow-timed-i2c
          python3 labmate/scripts/patch_momentum_resource_lease.py \
            momentum-src --allow-timed-i2c --apply
          git -C momentum-src diff --check
          test "$(git -C momentum-src diff --name-only | wc -l)" -eq 5
          grep -q 'FURI_HAL_RESOURCE_LEASE_API_V1' \
            momentum-src/targets/f7/furi_hal/furi_hal_resources.h
          grep -q 'uint32_t furi_hal_resource_lease_try_acquire' \
            momentum-src/targets/f7/furi_hal/furi_hal_resources.c
          grep -q 'Function,+,furi_hal_resource_lease_try_acquire,uint32_t,uint32_t' \
            momentum-src/targets/f7/api_symbols.csv
          grep -q 'Function,+,furi_hal_resource_lease_release,_Bool,"uint32_t, uint32_t"' \
            momentum-src/targets/f7/api_symbols.csv
          echo "E11.1a FIRMWARE SOURCE PATCH PASS (API DEFINED, NOT USED BY LEGACY HAL)."

      - name: Integrate unchanged LabMate source into patched SDK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p momentum-src/applications_user/labmate/src
          cp labmate/application.fam labmate/labmate_10px.png \
            momentum-src/applications_user/labmate/
          cp labmate/src/*.c labmate/src/*.h \
            momentum-src/applications_user/labmate/src/
          echo "Staged exact existing LabMate app, no new firmware lease callers."

      - name: Build real firmware and single integrated FAP in CI
        shell: bash
        working-directory: momentum-src
        timeout-minutes: 40
        env:
          FBT_GIT_SUBMODULE_SHALLOW: "1"
        run: |
          set -euo pipefail
          ./fbt firmware_all fap_labmate
          test -s build/f7-firmware-C/firmware.dfu
          test -s build/f7-firmware-C/firmware.elf
          test -s build/f7-firmware-C/.extapps/labmate.fap
          readelf -Ws build/f7-firmware-C/firmware.elf | awk '
            $4=="FUNC" && $5=="GLOBAL" && $7!="UND" &&
            $8=="furi_hal_resource_lease_try_acquire" {claim=1}
            $4=="FUNC" && $5=="GLOBAL" && $7!="UND" &&
            $8=="furi_hal_resource_lease_release" {release=1}
            $4=="FUNC" && $5=="GLOBAL" && $7!="UND" &&
            $8=="furi_hal_i2c_external_acquire_timeout" {i2c=1}
            END {exit !(claim && release && i2c)}
          '
          echo "REAL FIRMWARE + MATCHED FAP BUILD & EXPORTED ABI PASS (CI ONLY)."
          sha256sum build/f7-firmware-C/firmware.dfu \
            build/f7-firmware-C/.extapps/labmate.fap
          echo "NO ARTIFACT IS APPROVED FOR INSTALLATION; NO FLASH."
