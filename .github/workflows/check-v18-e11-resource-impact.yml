name: v1.8 E11 official rollback vs full updater SD impact (NO FLASH)

on:
  push:
    branches: [dev/v1.8-completion]
    paths:
      - ".github/workflows/check-v18-e11-resource-impact.yml"
      - "scripts/audit_v18_e11_resource_impact.py"
      - "scripts/derive_v18_e11_split_review.py"
      - "tests/test_v18_e11_split_review.py"
      - "tests/test_v18_e11_resource_impact.py"
      - "scripts/check_v18_full_vs_mntm012.py"
      - "scripts/check_v18_full_update_bundle.py"
      - "scripts/verify_v18_full_review_pair.py"
      - "scripts/stage_v18_e11_review_only.py"
      - "scripts/preflight_v18_e11_local.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  independently_pinned:
    name: Official 012 radio/option bytes and new SD resource delta (NO USB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout audit code (never firmware writer)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Synthetic negative-path SD archive and ownership tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -v -s tests -p test_v18_e11_resource_impact.py
          python3 -m unittest discover -v -s tests -p test_v18_e11_split_review.py
      - name: Fetch exact independently known official MNTM-012 rollback
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/e11-risk"
          curl --fail --location --retry 3 --silent --show-error \
            'https://github.com/Next-Flip/Momentum-Firmware/releases/download/mntm-012/flipper-z-f7-update-mntm-012.tgz' \
            -o "$RUNNER_TEMP/e11-risk/official-012.tgz"
          echo '1d9e1e600c8680172ff6f6913ca0b12484e7d45adbc72a66552e534784c8c1a7  '"$RUNNER_TEMP/e11-risk/official-012.tgz" | sha256sum --check
      - name: Fetch exact GitHub Actions full E11 review artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/e11-risk/full"
          gh run download 38966248325 \
            -R sehmusadsoy-ui/flipper-labmate \
            -n v18DEV-FULL-MNTM012-REVIEW-DO-NOT-FLASH \
            -D "$RUNNER_TEMP/e11-risk/full"
      - name: Compare updater RADIO+OB and inventory actual new vs old SD resources
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/audit_v18_e11_resource_impact.py \
            --official-rollback "$RUNNER_TEMP/e11-risk/official-012.tgz" \
            --candidate "$RUNNER_TEMP/e11-risk/full"
          echo 'PUBLIC REVIEW-ONLY BYTES; NO REAL DEVICE OR USER SD BACKUP ANALYZED.'
      - name: Generate isolated FAP-excluded REVIEW derivative and compare radio/OB
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/derive_v18_e11_split_review.py \
            --official-rollback "$RUNNER_TEMP/e11-risk/official-012.tgz" \
            --candidate "$RUNNER_TEMP/e11-risk/full" \
            --output "$RUNNER_TEMP/e11-derived-split-review-only"
          python3 scripts/check_v18_full_vs_mntm012.py \
            "$RUNNER_TEMP/e11-risk/official-012.tgz" \
            "$RUNNER_TEMP/e11-derived-split-review-only/firmware-full-update-SPLIT-REVIEW-DO-NOT-FLASH.tgz"
          echo 'FAP-excluded derivative has NO INSTALL AUTHORIZATION, no SDK rebuild and NO FLASH.'
      - name: Boundary declaration
        run: |
          echo 'NO DEVICE ACCESS, NO USB, NO FLASH, NO FAP INSTALL, NO REPAIR, NO RESTORE, NO RELEASE.'
