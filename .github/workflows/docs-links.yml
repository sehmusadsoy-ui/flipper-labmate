name: Documentation layout and link checks

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'ROADMAP.md'
      - 'scripts/check_repo_layout.py'
      - '.github/workflows/docs-links.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'
      - 'ROADMAP.md'
      - 'scripts/check_repo_layout.py'
      - '.github/workflows/docs-links.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned v7.0.1
        with:
          persist-credentials: false
      - name: Validate repository layout and Markdown links
        run: python3 scripts/check_repo_layout.py
