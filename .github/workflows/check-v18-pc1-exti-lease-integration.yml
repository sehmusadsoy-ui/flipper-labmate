name: v1.8 E11.1d PC1 EXTI production-driver gate (NO DEVICE)

on:
  push:
    branches: [dev/v1.8-completion]
    paths:
      - "src/labmate_frequency_capture.c"
      - "tests/test_v18_pc1_exti_lease_integration.py"
      - ".github/workflows/check-v18-pc1-exti-lease-integration.yml"
      - "scripts/patch_momentum_resource_lease.py"
      - "scripts/patch_momentum_gpio_tryadd.py"
      - "scripts/patch_momentum_i2c_timeout.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pc1-exti:
    name: Real PC1 C host denial paths and matched Momentum firmware FAP
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout DEV LabMate
        uses: actions/checkout@v4
        with:
          path: labmate
          persist-credentials: false

      - name: Execute actual PC1 start stop C functions with host HAL denial stubs
        shell: bash
        run: |
          set -euo pipefail
          python3 labmate/tests/test_v18_pc1_exti_lease_integration.py
          echo "This is host behavior evidence, not a physical GPIO ownership test."

      - name: Checkout pinned Momentum
        uses: actions/checkout@v4
        with:
          repository: Next-Flip/Momentum-Firmware
          ref: d3f89dfe2ef6b01839201598e9be1590cba80322
          path: momentum-src
          persist-credentials: false

      - name: Patch ephemeral pinned firmware API source only
        shell: bash
        run: |
          set -euo pipefail
          python3 labmate/scripts/patch_momentum_i2c_timeout.py momentum-src --apply
          python3 labmate/scripts/patch_momentum_resource_lease.py momentum-src --allow-timed-i2c --apply
          python3 labmate/scripts/patch_momentum_gpio_tryadd.py momentum-src --allow-prepatched --apply
          git -C momentum-src diff --check

      - name: Stage one genuine LabMate FAP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p momentum-src/applications_user/labmate/src
          cp labmate/application.fam labmate/labmate_10px.png momentum-src/applications_user/labmate/
          cp labmate/src/*.c labmate/src/*.h momentum-src/applications_user/labmate/src/

      - name: Compile exact firmware and FAP and check exports
        shell: bash
        working-directory: momentum-src
        timeout-minutes: 40
        env:
          FBT_GIT_SUBMODULE_SHALLOW: "1"
        run: |
          set -euo pipefail
          ./fbt firmware_all fap_labmate
          test -s build/f7-firmware-C/firmware.dfu
          test -s build/f7-firmware-C/.extapps/labmate.fap
          readelf -Ws build/f7-firmware-C/firmware.elf | awk '
            $4=="FUNC" && $5=="GLOBAL" && $7!="UND" &&
            $8=="furi_hal_resource_lease_try_acquire" {claim=1}
            $4=="FUNC" && $5=="GLOBAL" && $7!="UND" &&
            $8=="furi_hal_resource_lease_release" {release=1}
            $4=="FUNC" && $5=="GLOBAL" && $7!="UND" &&
            $8=="furi_hal_gpio_try_add_int_callback" {gpio=1}
            $4=="FUNC" && $5=="GLOBAL" && $7!="UND" &&
            $8=="furi_hal_i2c_external_acquire_timeout" {i2c=1}
            END {exit !(claim && release && gpio && i2c)}
          '
          sha256sum build/f7-firmware-C/firmware.dfu build/f7-firmware-C/.extapps/labmate.fap
          echo "E11.1d PC1/EXTI LEASE DRIVER MATCHED BUILD PASS (CI ONLY)."
          echo "OTHER MOMENTUM SERVICES MAY BYPASS LEASE. NO USB/FLASH/STABLE."
