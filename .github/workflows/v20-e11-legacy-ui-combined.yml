name: LabMate E11 migrated legacy UI combined pre-device acceptance
on:
  workflow_dispatch:
  push:
    branches: [dev/v2.0-e11-legacy-ui-harness-review-20261029, audit/software-fixes-20261107, fix/v20-review-fixes-20261112]
    paths:
      - ".gitattributes"
      - "application.fam"
      - "labmate_10px.png"
      - "src/**"
      - "tests/**"
      - "scripts/test-v20-*-host.sh"
      - "scripts/audit-v20-e11-predevice.sh"
      - "scripts/audit-v20-e11-legacy-coverage.sh"
      - "scripts/audit-v20-e11-*.py"
      - "scripts/audit-v20-ultimate-sources.py"
      - "scripts/test-v20-ultimate-ui-contract.py"
      - "docs/development/V20_E11_CURRENT_ACCEPTANCE_COVERAGE.md"
      - "docs/development/V20_E11_BUTTON_SCOPE_COMBINED_ACCEPTANCE.md"
      - ".github/workflows/v20-e11-legacy-ui-combined.yml"
permissions:
  contents: read
jobs:
  combined:
    name: E11 current render + captures + A/B + all accepted core/evidence gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Combined GCC and Clang exact source acceptance
        run: sh scripts/audit-v20-e11-legacy-coverage.sh
      - name: State remaining release blockers
        run: |
          echo "Current E11 software acceptance and persistence regression gates passed."
          echo "LevelWitness is explicitly retired (exit77, NOT PASS); Scope MAD and former tile UI are retired outputs."
          echo "Startup/OOM #31, physical screenshots, resource contention and live SD/fault gates OPEN."
          echo "No FAP install, no stable promotion."
