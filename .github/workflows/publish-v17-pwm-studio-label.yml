name: LabMate v1.7 In-Place PWM Studio Label Update

on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-v17-pwm-studio-label.yml"]

permissions:
  contents: read

jobs:
  replace_v17_assets:
    name: Replace only approved v1.7 assets; record FAP provenance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.7
      RELEASE_ID: "410833587"
      SOURCE_SHA: 0aeb0ca7ceba092c8adb6e44add0a2212cae1a74
      SOURCE_RUN: "38290044094"
      EXPECTED_OLD: 5a7cb0eae601eeac8856790211c4d2831a9198c31853631e1daf0308ce724335
      EXPECTED_NEW: a0b305e5fd8d71c85c51480ee06a8b7e5ebd5bee0e82935b0ed3b7e74e7ebcea
      EXPECTED_V17_TAG: d0e1bc6a95b257841533f0aa8745e3a79bbc8dcd
      EXPECTED_V161_TAG: bc63271afe572c393c1febd0f0ef7039404bc937
      EXPECTED_RC1_TAG: d55eec032e5f341f39aa7c98915ec2062995e66b
    steps:
      - name: Check out current main, preserve original v1.7 tag
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Download exact 4-of-4 device-tested FAP from successful CI
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = main
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq '.head_sha')" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq '.conclusion')" = success
          # Only source/documentation-equivalent FAP is eligible, never compile a different FAP here.
          git diff --quiet "$SOURCE_SHA" HEAD -- '*.c' '*.h' application.fam
          gh run download "$SOURCE_RUN" -R "$GITHUB_REPOSITORY" -n labmate -D candidate
          test -s candidate/labmate.fap
          test -s candidate/SHA256SUMS.txt
          test "$(wc -l < candidate/SHA256SUMS.txt)" -eq 1
          (cd candidate && sha256sum -c SHA256SUMS.txt)
          test "$(sha256sum candidate/labmate.fap | cut -d' ' -f1)" = "$EXPECTED_NEW"

      - name: Check release identity, old hash, previous release immutability
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.sha')" = "$EXPECTED_V17_TAG"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.6.1" --jq '.object.sha')" = "$EXPECTED_V161_TAG"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v1.7-rc1" --jq '.object.sha')" = "$EXPECTED_RC1_TAG"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.6.1" --jq '.prerelease')" = false
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v1.7-rc1" --jq '.prerelease')" = true
          info="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          test "$(jq -r '.tag_name' <<< "$info")" = "$TAG"
          test "$(jq -r '.draft' <<< "$info")" = false
          test "$(jq -r '.prerelease' <<< "$info")" = false
          test "$(jq -r '.target_commitish' <<< "$info")" = "$EXPECTED_V17_TAG"
          test "$(jq -r '[.assets[].name] | sort | join(",")' <<< "$info")" = "SHA256SUMS.txt,labmate.fap"
          test "$(jq -r '.assets[] | select(.name == "labmate.fap") | .digest' <<< "$info")" = "sha256:$EXPECTED_OLD"
          mkdir -p previous
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p labmate.fap -p SHA256SUMS.txt -D previous
          (cd previous && sha256sum -c SHA256SUMS.txt)
          test "$(sha256sum previous/labmate.fap | cut -d' ' -f1)" = "$EXPECTED_OLD"

      - name: Replace v1.7 assets in place and append transparent release provenance
        shell: bash
        run: |
          set -euo pipefail
          changed=0
          restore_previous() {
            result=$?
            trap - EXIT
            if [ "$result" -ne 0 ] && [ "$changed" -eq 1 ]; then
              echo "::warning::Update failed; attempting to restore original verified release assets"
              gh release upload "$TAG" previous/labmate.fap previous/SHA256SUMS.txt -R "$GITHUB_REPOSITORY" --clobber || true
            fi
            exit "$result"
          }
          trap restore_previous EXIT
          changed=1
          gh release upload "$TAG" candidate/labmate.fap candidate/SHA256SUMS.txt -R "$GITHUB_REPOSITORY" --clobber
          info="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
          test "$(jq -r '[.assets[].name] | sort | join(",")' <<< "$info")" = "SHA256SUMS.txt,labmate.fap"
          test "$(jq -r '.assets[] | select(.name == "labmate.fap") | .digest' <<< "$info")" = "sha256:$EXPECTED_NEW"
          test "$(jq -r '.assets[] | select(.name == "SHA256SUMS.txt") | .digest' <<< "$info")" = "sha256:$(sha256sum candidate/SHA256SUMS.txt | cut -d' ' -f1)"
          mkdir -p check
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p labmate.fap -p SHA256SUMS.txt -D check
          (cd check && sha256sum -c SHA256SUMS.txt)
          test "$(sha256sum check/labmate.fap | cut -d' ' -f1)" = "$EXPECTED_NEW"
          old_notes="$(jq -r '.body' <<< "$info")"
          {
            cat <<EOF
          ## In-place PWM Studio naming fix — 2026-10-12 (still v1.7)

          **Current downloadable FAP SHA256:** \`A0B305E5FD8D71C85C51480EE06A8B7E5EBD5BEE0E82935B0ED3B7E74E7EBCEA\`.
          The OUTPUT menu now reads **PWM Studio** and About/Tool Guide reads **PWM STUDIO** instead of the older **Signal Generator** label.
          Functional PWM code, saved CSV/Profile formats and version label are unchanged.
          This exact binary came from source commit \`$SOURCE_SHA\`, [CI $SOURCE_RUN](https://github.com/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN) (2/2 PASS), and passed **4/4 user-reported on-device checks** for both visible names, PWM RUN/STOP, Profile S1 and CSV history.
          **The original \`v1.7\` Git tag remains pinned to \`$EXPECTED_V17_TAG\`**; this FAP is an explicitly documented post-tag, in-place UI label correction. The original published FAP had SHA256 \`$EXPECTED_OLD\` and is superseded by the current binary.
          \`SHA256SUMS.txt\` was replaced with the matching value and independently checked after re-download. Older v1.6.1 Stable and v1.7 RC1 releases were not altered.

          ---

          EOF
            printf '%s\n' "$old_notes"
          } > release-notes-update.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file release-notes-update.md
          after="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          test "$(jq -r '.draft' <<< "$after")" = false
          test "$(jq -r '.prerelease' <<< "$after")" = false
          test "$(jq -r '.target_commitish' <<< "$after")" = "$EXPECTED_V17_TAG"
          test "$(jq -r '.body' <<< "$after" | head -n 1)" = "## In-place PWM Studio naming fix — 2026-10-12 (still v1.7)"
          test "$(jq -r '.assets[] | select(.name == "labmate.fap") | .digest' <<< "$after")" = "sha256:$EXPECTED_NEW"
          changed=0
          echo "v1.7 STABLE EXISTING RELEASE ASSETS REPLACED AND RE-VERIFIED"
          echo "Source commit: $SOURCE_SHA"
          echo "FAP sha256: $EXPECTED_NEW"
