# Archived: this workflow is intentionally disabled to preserve v1.4 Release assets.
name: Publish LabMate v1.4 Stable

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: labmate-v1.4-publish
  cancel-in-progress: false

jobs:
  release:
    name: Build Momentum FAP and publish v1.4
    # Archived after v1.6: keep workflow history, never mutate older releases.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out stable source
        uses: actions/checkout@v4

      - name: Detect an existing v1.4 release
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.4 --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v1.4 is already published; refusing to replace release assets."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Synchronize notes for the already-published v1.4
        if: steps.existing.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v1.4 --repo "${{ github.repository }}" --notes-file RELEASE_NOTES_v1.4.md
          echo "Verified v1.4 notes are now visible on GitHub Releases."

      - name: Compile against Momentum Firmware SDK
        id: compile
        if: steps.existing.outputs.exists == 'false'
        uses: flipperdevices/flipperzero-ufbt-action@v0.1
        with:
          sdk-channel: dev
          sdk-index-url: https://up.momentum-fw.dev/firmware/directory.json

      - name: Verify output and write checksums
        if: steps.existing.outputs.exists == 'false'
        env:
          BUILT_API_VERSION: ${{ steps.compile.outputs.api-version }}
        run: |
          set -euo pipefail
          mkdir -p release
          FAP="$(find . -type f -name 'labmate.fap' -not -path './.git/*' -print -quit)"
          if [ -z "$FAP" ] || [ ! -s "$FAP" ]; then
            echo "::error::No non-empty labmate.fap generated by the Momentum SDK build"
            exit 1
          fi
          cp "$FAP" release/labmate-v1.4.fap
          ( cd release && sha256sum labmate-v1.4.fap > SHA256SUMS.txt )
          file release/labmate-v1.4.fap
          ls -lh release/
          echo "Momentum SDK API version: $BUILT_API_VERSION"
          {
            echo
            echo "### CI binary provenance"
            echo
            echo "The downloadable FAP was built by GitHub Actions from the v1.4 source with the Momentum Firmware **dev** SDK (API: `$BUILT_API_VERSION`). The developer's on-device functional tests used Momentum API 87.1. These APIs can differ; rebuild with your installed SDK if necessary."
          } >> RELEASE_NOTES_v1.4.md

      - name: Upload build artifact for audit
        if: steps.existing.outputs.exists == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: labmate-v1.4-momentum-fap
          path: release/
          if-no-files-found: error

      - name: Create v1.4 tag and GitHub Release with FAP
        if: steps.existing.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.4             release/labmate-v1.4.fap             release/SHA256SUMS.txt             --repo "${{ github.repository }}"             --target "${{ github.sha }}"             --title "LabMate v1.4 Stable"             --notes-file RELEASE_NOTES_v1.4.md             --latest
          gh release view v1.4 --repo "${{ github.repository }}"
