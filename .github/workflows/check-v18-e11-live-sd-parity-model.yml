name: v1.8 E11 LabMate SD backup parity model (NO DEVICE)

on:
  push:
    branches: [dev/v1.8-completion]
    paths:
      - ".github/workflows/check-v18-e11-live-sd-parity-model.yml"
      - "scripts/audit_v18_e11_live_labmate_sd.py"
      - "tests/test_v18_e11_live_labmate_sd.py"
      - "scripts/snapshot_v18_e11_live_labmate_sd.py"
      - "tests/test_v18_e11_live_snapshot.py"
      - "scripts/survey_v18_e11_external_sd_ro.py"
      - "tests/test_v18_e11_external_sd_ro.py"
      - "scripts/backup_v18_e11_sd_reader_to_pc.py"
      - "tests/test_v18_e11_full_sd_pc_copy.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows_model:
    name: Windows simulated Flipper SD CLI listings/hash and old backup drift
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout no-flash SD audit model
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run simulated real CLI responses, never connect to a device
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m unittest discover -v -s tests -p test_v18_e11_live_labmate_sd.py
          if ($LASTEXITCODE -ne 0) { throw "E11 SD parity model failed" }
          python -m unittest discover -v -s tests -p test_v18_e11_live_snapshot.py
          if ($LASTEXITCODE -ne 0) { throw "E11 safe PC snapshot tests failed" }
          python -m unittest discover -v -s tests -p test_v18_e11_external_sd_ro.py
          if ($LASTEXITCODE -ne 0) { throw "E11 external SD scope read-only survey tests failed" }
          Write-Host "FLIPPER LABMATE SD PARITY READ-ONLY MODEL PASS"
          Write-Host "HISTORICAL MISSING LOGS REMAIN AN UNRESOLVED DATA PARITY QUESTION"
          Write-Host "NO COM, USB, DEVICE WRITE, FLASH, FORMAT OR RESTORE"
