name: E11 H1 native PWM versus JS original-C joint arbitration (HOST ONLY)

on:
  push:
    branches: [dev/v1.8-completion]
    paths:
      - ".github/workflows/check-v18-e11-h1-pwm-js-joint.yml"
      - "tests/test_v18_e11_h1_pwm_js_joint.py"
      - "tests/test_v18_e11_h1_closeout_ledger.py"
      - "docs/V1_8_E11_H1_CLOSEOUT_DECISION_2026-10-17.md"
      - "tests/test_v18_pwm_native_joint.py"
      - "tests/test_v18_native_pwm_lease.py"
      - "scripts/patch_momentum_native_js_gpio_lease.py"
      - "scripts/patch_momentum_native_pwm_lease.py"
      - "scripts/patch_momentum_resource_lease.py"
      - "src/labmate_generator.c"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  joint_h1_cooperative_host:
    name: Exact PWM HAL + LabMate + JS original C in one HOST process - NEVER DEVICE
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: LabMate DEV checkout
        uses: actions/checkout@v4
        with:
          path: labmate
          persist-credentials: false
      - name: Pinned Momentum exact source checkout
        uses: actions/checkout@v4
        with:
          repository: Next-Flip/Momentum-Firmware
          ref: d3f89dfe2ef6b01839201598e9be1590cba80322
          path: momentum-src
          persist-credentials: false
      - name: Apply approved lease, GPIO callback and native PWM + JS patches only in ephemeral source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C momentum-src rev-parse HEAD)" = "d3f89dfe2ef6b01839201598e9be1590cba80322"
          python3 labmate/scripts/patch_momentum_i2c_timeout.py momentum-src --apply
          python3 labmate/scripts/patch_momentum_resource_lease.py momentum-src --allow-timed-i2c --apply
          python3 labmate/scripts/patch_momentum_gpio_tryadd.py momentum-src --allow-prepatched --apply
          python3 labmate/scripts/patch_momentum_native_pwm_lease.py momentum-src --apply
          python3 labmate/scripts/patch_momentum_native_js_gpio_lease.py momentum-src --apply
          git -C momentum-src diff --check
      - name: Compile and run original-C host PWM/JS rejection and release lifecycle
        shell: bash
        run: |
          set -euo pipefail
          python3 labmate/tests/test_v18_e11_h1_pwm_js_joint.py momentum-src
          python3 -m unittest discover -v -s labmate/tests -p test_v18_e11_h1_closeout_ledger.py
          echo "E11 H1 COOPERATIVE SOFTWARE HOST GATE PASS; LIVE H1 JS BUSY REMAINS NOT TESTED."
          echo "No flash, no serial, no firmware install, no production app changes."
