name: E11 single-FAP guarded non-app staging host mocks (NO DEVICE)

on:
  push:
    branches: [dev/v1.8-completion]
    paths:
      - ".github/workflows/check-v18-e11-final-fap-stage-guard.yml"
      - "scripts/stage_v18_final_fap_on_device_one_file.py"
      - "tests/test_v18_final_fap_on_device_stage.py"
      - "scripts/run-v18-e11-final-one-fap-stage.ps1"
      - "scripts/check_v18_e11_final_fap_prewrite_ro.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  one_stage_only_mock:
    name: E11 stage only one nonapp SD sidecar; original FAP never written (HOST MOCK)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python compiler and synthetic USB commands only
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/stage_v18_final_fap_on_device_one_file.py
          python3 -m unittest discover -v -s tests -p test_v18_final_fap_on_device_stage.py
          echo "STAGE-ONLY MOCK PASS. NO USER USB, NO FAP REPLACEMENT, NO FIRMWARE."
      - name: Syntax-parse one-file operator PowerShell wrapper without execution
        shell: pwsh
        run: |
          $t = $null
          $e = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/run-v18-e11-final-one-fap-stage.ps1').Path,
            [ref]$t, [ref]$e) | Out-Null
          if ($e.Count -ne 0) {
            $e | ForEach-Object { Write-Error $_.Message }
            throw 'E11 FAP-only stage PowerShell syntax rejected'
          }
          Write-Host 'E11 ONE-FAP STAGE PS SYNTAX PASS - NO DEVICE OPERATIONS'
