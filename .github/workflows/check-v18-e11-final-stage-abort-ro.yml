name: E11 aborted FAP stage read-only state audit (HOST ONLY)

on:
  push:
    branches: [dev/v1.8-completion]
    paths:
      - ".github/workflows/check-v18-e11-final-stage-abort-ro.yml"
      - "scripts/check_v18_final_stage_after_abort_ro.py"
      - "tests/test_v18_final_stage_abort_readonly.py"
      - "scripts/run-v18-e11-stage-abort-readonly.ps1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline_fake_transport:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test only read-only commands; never connect device or delete staging
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/check_v18_final_stage_after_abort_ro.py
          python3 -m unittest discover -v -s tests -p test_v18_final_stage_abort_readonly.py
          echo "E11 ABORTED FAP STAGE READ-ONLY AUDIT MOCK PASS - NO USB, NO WRITE, NO RETRY"
      - name: Syntax-parse operator PowerShell diagnosis only (NEVER EXECUTE)
        shell: pwsh
        run: |
          $t=$null
          $e=$null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'scripts/run-v18-e11-stage-abort-readonly.ps1').Path,
            [ref]$t, [ref]$e) | Out-Null
          if ($e.Count -ne 0) {
            $e | ForEach-Object { Write-Error $_.Message }
            throw 'E11 abort diagnosis wrapper invalid'
          }
          Write-Host 'POWER SHELL DIAGNOSIS SYNTAX ONLY PASS - NO SERIAL'
